<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050f">
<title>Sadia AI – Version X</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Dancing+Script:wght@700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#27d7ff;--m:#c04cff;--t:#eaf6ff;--dim:rgba(234,246,255,.62);--g:#2bff9a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;width:100%;max-width:100vw;overflow:hidden;color:var(--t);font-family:'Hind Siliguri',sans-serif;background:radial-gradient(ellipse at 50% 22%,#0d2a7a 0,#060c2a 45%,#02040f 100%)}
body[data-s=speaking]{--c:#2bff9a}body[data-s=thinking]{--c:#c04cff}body[data-s=listening]{--c:#27d7ff}
#bg{position:fixed;inset:0;z-index:0;opacity:.55;pointer-events:none}
#app{position:relative;z-index:1;width:100%;max-width:100vw;min-width:0;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto auto;gap:6px;padding:max(10px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom))}
/* header */
header{display:flex;align-items:center;gap:10px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 8px rgba(192,76,255,.6))}
.brand h1{font:900 17px 'Hind Siliguri',sans-serif;letter-spacing:.5px;color:#fff;white-space:nowrap}
.brand h1 span{color:var(--c)}
.brand p{font-size:9.5px;color:var(--c);white-space:nowrap}
#nav{display:flex;gap:6px;margin-left:auto;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;border:1px solid rgba(39,215,255,.45);background:rgba(8,20,60,.55);color:var(--t);font:500 11px 'Hind Siliguri',sans-serif;white-space:nowrap;cursor:pointer;box-shadow:0 0 12px rgba(39,215,255,.12)}
.pill.on{border-color:var(--c);box-shadow:0 0 16px rgba(39,215,255,.45),inset 0 0 12px rgba(39,215,255,.18)}
.pill svg{width:13px;height:13px}
#gear{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--c);background:rgba(8,20,60,.6);color:#fff;box-shadow:0 0 14px rgba(39,215,255,.5);cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* hero */
#hero{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.hello{position:absolute;left:4px;top:6%;z-index:2;max-width:44%}
.hello .script{font:700 clamp(28px,7.5vw,38px)/1 'Dancing Script',cursive;background:linear-gradient(90deg,#ff5fd0,#8e7bff 45%,#27d7ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(192,76,255,.5))}
.hello h2{font:600 clamp(14px,3.8vw,17px) 'Hind Siliguri',sans-serif;color:#fff;margin-top:12px}
.hello h2 em{font-style:normal;color:#ff7ad9}
.hello p{font:500 clamp(11px,3vw,13px)/1.35 'Hind Siliguri',sans-serif;color:var(--c);margin-top:6px}
.side{position:absolute;right:2px;top:10%;z-index:2;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.side .pill{justify-content:flex-start;padding:5px 9px;font-size:11px;min-width:92px}
.side .pill i{width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);flex:none}
.side .pill svg{color:var(--c)}
#stage{position:absolute;left:50%;top:50%;width:min(50vw,210px);height:min(50vw,210px);transform:translate(-50%,-48%);z-index:1}
#stage svg{width:100%;height:100%;stroke:none;fill:none;overflow:visible}
.plat{position:absolute;left:50%;bottom:4%;width:min(78vw,340px);height:70px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(39,215,255,.55),rgba(60,20,160,.25) 60%,transparent);filter:blur(4px);z-index:0}
.ring{position:absolute;left:50%;top:50%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0}
.r1{width:min(88vw,380px);border:1.5px solid rgba(39,215,255,.35);box-shadow:0 0 22px rgba(39,215,255,.2)}
.r2{width:min(70vw,300px);border:1px dashed rgba(192,76,255,.5);animation:spin 26s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#cap{position:absolute;left:12px;right:12px;bottom:0;z-index:3;text-align:center;font-size:15px;line-height:1.5;color:#fff;text-shadow:0 0 12px rgba(0,0,0,.9);opacity:0;transition:.3s}
#cap.show{opacity:1}
/* chat card */
#right{position:relative;display:flex;flex-direction:column;min-height:0;height:min(24vh,186px);border-radius:20px;border:1.5px solid rgba(192,76,255,.7);background:linear-gradient(180deg,rgba(14,14,50,.55),rgba(6,8,30,.7));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 26px rgba(192,76,255,.35),inset 0 0 26px rgba(39,215,255,.06);padding:10px 12px}
.chathead{display:flex;align-items:center;gap:8px;padding:0 4px 4px;font:600 11px 'Hind Siliguri',sans-serif;color:var(--dim)}
.chathead b{margin-left:auto;font-weight:600;color:var(--g);font-size:11px}
#agents{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:auto;max-width:60%}
#agents div{flex:none;font:700 9px Orbitron,sans-serif;padding:4px 8px;border-radius:999px;border:1px solid rgba(39,215,255,.35);opacity:.6}
#agents .work{opacity:1;border-color:var(--c);color:#fff;box-shadow:0 0 10px rgba(39,215,255,.5)}
#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 2px 2px 0;font-size:13px;line-height:1.5;scroll-behavior:smooth;background:transparent}
.m{position:relative;max-width:88%;padding:7px 11px;border-radius:14px;white-space:normal;animation:in .3s ease-out;box-shadow:none}
.m.a{margin-left:42px;background:rgba(10,30,90,.35);border:1px solid rgba(39,215,255,.35);border-bottom-left-radius:6px}
.m.a::before{content:"";position:absolute;left:-40px;top:0;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9af0ff 30%,#27d7ff 60%,#1a2a80);box-shadow:0 0 12px rgba(39,215,255,.6)}
.m.u{margin-left:auto;background:linear-gradient(135deg,rgba(124,58,237,.45),rgba(192,38,211,.3));border:1px solid rgba(192,76,255,.5);border-bottom-right-radius:6px}
.m.u::after{display:none}
.m .meta{margin-top:4px;padding-top:0;border:0;font-size:10px;color:var(--dim)}
.m .meta button{width:22px;height:22px;background:none;opacity:.6}
.m .body{word-break:break-word}
.code{background:rgba(4,10,30,.6);border-radius:10px;margin:6px 0}
.dots i{width:6px;height:6px;margin:0 3px;box-shadow:none}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
/* tiles */
#tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:7px 3px;border-radius:14px;border:1px solid rgba(39,215,255,.5);background:linear-gradient(180deg,rgba(14,22,70,.6),rgba(6,10,36,.8));color:#fff;cursor:pointer;box-shadow:0 0 16px rgba(39,215,255,.18),inset 0 1px 0 rgba(255,255,255,.08);min-width:0}
.tile:nth-child(2){border-color:rgba(192,76,255,.6);box-shadow:0 0 16px rgba(192,76,255,.2)}
.tile:nth-child(3){border-color:rgba(255,122,217,.55)}
.tile:nth-child(4){border-color:rgba(39,215,255,.5)}
.tile svg{width:19px;height:19px;color:var(--c)}
.tile:nth-child(2) svg{color:#d58cff}.tile:nth-child(3) svg{color:#ff7ad9}
.tile b{font:600 11.5px 'Hind Siliguri',sans-serif;white-space:nowrap}
.tile em{font:400 8px Orbitron,sans-serif;font-style:normal;color:var(--dim);letter-spacing:.5px}
/* bottom bar */
#bar{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:999px;border:1px solid rgba(39,215,255,.55);background:rgba(6,10,36,.75);box-shadow:0 0 22px rgba(39,215,255,.25),inset 0 0 18px rgba(192,76,255,.08)}
#bar button{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(39,215,255,.7);background:rgba(8,20,60,.6);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 12px rgba(39,215,255,.35)}
#mic{width:44px;height:44px;border-color:#c04cff;background:radial-gradient(circle,rgba(192,76,255,.5),rgba(40,10,90,.7));box-shadow:0 0 22px rgba(192,76,255,.7);animation:pulse2 2.2s infinite}
#mic.on{background:radial-gradient(circle,#d58cff,#6d28d9)}
#send{width:42px;border:none;background:linear-gradient(135deg,#ff5fd0,#8e7bff 50%,#27d7ff);color:#fff;box-shadow:0 0 18px rgba(142,123,255,.7)}
#stop{border-color:#ff4f8b;color:#ff4f8b;box-shadow:0 0 12px rgba(255,79,139,.4)}
textarea#inp{flex:1;min-width:0;height:38px;padding:9px 14px 9px 36px;border-radius:999px;border:1px solid rgba(39,215,255,.45);background:rgba(4,8,30,.6);color:var(--t);font:500 13px 'Hind Siliguri',sans-serif;outline:none;resize:none;line-height:1.4;max-height:120px;background-image:radial-gradient(circle at 16px 50%,#27d7ff 0 1.5px,transparent 2px)}
textarea#inp::placeholder{color:rgba(234,246,255,.5)}
#vis{display:none}
#footer{display:flex;justify-content:center;align-items:center;gap:8px;font:600 9.5px 'Hind Siliguri',sans-serif;color:var(--dim);padding-top:2px}
#footer span{color:var(--c)}
#footer::before,#footer::after{content:"";width:52px;height:1px;background:linear-gradient(90deg,transparent,var(--c))}
#footer::after{transform:scaleX(-1)}
#hud,.chathead>.sysx{display:none}
#err{display:none;position:fixed;z-index:99;left:8px;right:8px;top:8px;padding:10px;border-radius:10px;background:#7a0020;color:#fff;font:13px monospace;white-space:pre-wrap}
#cam{position:fixed;top:72px;right:16px;width:96px;border:1.5px solid var(--c);border-radius:14px;z-index:5}
#sheet{position:fixed;left:12px;right:12px;bottom:12px;z-index:20;padding:16px;border-radius:22px;border:1px solid #c04cff;background:rgba(6,10,32,.96);backdrop-filter:blur(18px);box-shadow:0 0 30px rgba(192,76,255,.5);display:flex;flex-direction:column;gap:12px;max-height:72dvh;overflow-y:auto}
#sheet[hidden]{display:none}
#sheet h3{font:700 15px Orbitron,sans-serif;color:var(--c)}
#sheet .row{display:flex;gap:8px;flex-wrap:wrap}
#sheet button{padding:10px 14px;border-radius:12px;border:1px solid rgba(39,215,255,.5);background:rgba(8,20,60,.5);color:var(--t);font:500 15px 'Hind Siliguri',sans-serif;cursor:pointer}
#sheet button.on{background:var(--c);color:#00121a;font-weight:600}
#sheet input[type=url],#sheet input[type=password]{width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid rgba(39,215,255,.5);background:rgba(0,0,0,.4);color:var(--t);font:14px monospace}
#sheet input[type=range]{width:100%;accent-color:#c04cff}
#sheet small{opacity:.7;font-size:13px}
@keyframes blink{50%{opacity:.35}}
@keyframes pulse2{50%{box-shadow:0 0 34px rgba(192,76,255,.9)}}
@keyframes bar{50%{height:30px}}
@media(max-width:820px){.brand p{display:none}.side .pill{min-width:0;font-size:11px;padding:6px 9px}.side .pill i{width:7px;height:7px}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="err"></div>
<div id="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#27d7ff"/><stop offset="1" stop-color="#c04cff"/></linearGradient></defs><path d="M32 48C20 44 14 34 16 24c6 2 12 8 16 24zM32 48c12-4 18-14 16-24-6 2-12 8-16 24z" fill="none" stroke="url(#lg)" stroke-width="2.5"/><path d="M32 46C26 34 26 24 32 12c6 12 6 22 0 34z" fill="none" stroke="url(#lg)" stroke-width="2.5"/><path d="M8 44h48" stroke="url(#lg)" stroke-width="1.5" opacity=".6"/></svg>
      <div><h1>SADIA <span>AI</span></h1><p>Your Personal AI Assistant</p></div>
    </div>
    <nav id="nav">
      <button class="pill on" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
      <button class="pill" data-nav="memory"><svg viewBox="0 0 24 24"><path d="M9 3a3 3 0 0 0-3 3v1a3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3V3zM15 3a3 3 0 0 1 3 3v1a3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3V3z"/></svg>Memory</button>
      <button class="pill" data-nav="tools"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Tools</button>
      <button id="gear" title="সেটিংস" aria-label="সেটিংস"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </nav>
  </header>
  <section id="hero">
    <div class="ring r1"></div><div class="ring r2"></div>
    <div class="plat"></div>
    <div class="hello">
      <div class="script">Hello!</div>
      <h2>I'm Sadia <em>♥</em></h2>
      <p>How can I help you today?</p>
    </div>
    <div class="side">
      <div class="pill"><i></i>Online</div>
      <div class="pill"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Ready</div>
      <div class="pill" id="pillState"><svg viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/></svg>Idle</div>
    </div>
    <div id="stage"></div>
    <div id="cap"></div>
  </section>
  <section id="right">
    <div class="chathead">সংলাপ <nav id="agents"></nav></div>
    <div id="log"><div class="m a">হ্যালো! আমি সাদিয়া 💙
আমি Version X-এর AI সহকারী। আপনি কেমন আছেন?</div></div>
  </section>
  <div id="tiles">
    <button class="tile" data-tile="chat"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><b>চ্যাট</b><em>CHAT</em></button>
    <button class="tile" data-tile="voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><b>ভয়েস</b><em>VOICE</em></button>
    <button class="tile" data-tile="memory"><svg viewBox="0 0 24 24"><path d="M9 3a3 3 0 0 0-3 3v1a3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3V3zM15 3a3 3 0 0 1 3 3v1a3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3V3z"/></svg><b>স্মৃতি</b><em>MEMORY</em></button>
    <button class="tile" data-tile="media"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><b>মিডিয়া</b><em>MEDIA</em></button>
  </div>
  <footer id="bar">
    <button id="mic" title="মাইক" aria-label="মাইক"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="camb" title="ক্যামেরা" aria-label="ক্যামেরা"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <textarea id="inp" rows="1" placeholder="সাদিয়াকে বলুন..."></textarea>
    <button id="send" title="পাঠান" aria-label="পাঠান"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-7-8-3z"/></svg></button>
    <button id="stop" title="থামান" aria-label="থামান"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
  </footer>
  <div id="footer">Powered by <span>Sadia AI</span></div>
</div>
<div id="hidden-state" style="display:none"><span id="state">IDLE</span><span id="stat"></span><span id="vis"></span><span id="clock"></span><span id="batt"></span><span id="date"></span><span id="net"></span><span id="online"></span><span id="mem">0</span><span id="chips"></span></div>
<div id="sheet" hidden>
  <h3>সেটিংস</h3>
  <div class="row"><button data-v="auto">🤝 হাইব্রিড</button><button data-v="sadia">✨ সাদিয়া ভয়েস</button><button data-v="google">🔈 গুগল ভয়েস</button></div>
  <small>হাইব্রিড: আগে সাদিয়ার নিজস্ব ভয়েস, না পেলে ফোনের গুগল ভয়েস।</small>
  <label>কথার গতি<input id="rate" type="range" min=".8" max="1.3" step=".05" value="1"></label>
  <div class="row"><button id="vtest">🔊 পরীক্ষা করুন</button><button id="wtest">🧪 সার্ভার টেস্ট</button><button id="clear">🗑 চ্যাট মুছুন</button><button id="sclose">✕ বন্ধ</button></div>
  <label>অ্যাপ টোকেন<input id="tok" type="password" placeholder="APP_TOKEN"></label>
  <div class="row"><button id="tsave">🔐 টোকেন সেভ</button><button id="wsave" hidden>সেভ</button></div>
</div>
<video id="cam" playsinline muted hidden></video>
<script>
(()=>{
const st=document.getElementById('state');
const PS={IDLE:'প্রস্তুত',LISTENING:'শুনছি...',THINKING:'ভাবছি...',SPEAKING:'বলছি...'};
new MutationObserver(()=>{document.body.dataset.s=st.textContent.toLowerCase();const p=document.getElementById('pillState');if(p&&p.lastChild)p.lastChild.textContent=' '+(PS[st.textContent]||st.textContent)}).observe(st,{childList:true,characterData:true,subtree:true});
const vis=document.getElementById('vis');for(let i=0;i<20;i++){const b=document.createElement('b');b.style.animationDelay=(i*.07)+'s';vis.append(b)}
const ck=()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'});ck();setInterval(ck,30000);
navigator.getBattery?.().then(b=>{const u=()=>document.getElementById('batt').textContent='🔋'+Math.round(b.level*100)+'%';u();b.onlevelchange=u});
const $$=id=>document.getElementById(id);
const dt=()=>$$('date').textContent=new Date().toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long'});dt();
const nt=()=>{$$('net').textContent=navigator.onLine?'অনলাইন':'অফলাইন';$$('online').textContent=navigator.onLine?'● অনলাইন':'● অফলাইন'};nt();addEventListener('online',nt);addEventListener('offline',nt);
const mm=()=>{try{$$('mem').textContent=JSON.parse(localStorage.getItem('vx_facts')||'[]').length}catch{$$('mem').textContent='0'}};mm();setInterval(mm,8000);
const cv=document.getElementById('bg'),cx=cv.getContext('2d');let W,H,P=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(80,W/9|0)},()=>({x:Math.random()*W,y:Math.random()*H,v:.12+Math.random()*.35,r:Math.random()*1.5+.3,t:Math.random()*6}))}
addEventListener('resize',rs);rs();
(function f(){cx.clearRect(0,0,W,H);const c=getComputedStyle(document.body).getPropertyValue('--rc').trim()||'#00d2ff';for(const p of P){p.y-=p.v;p.t+=.02;if(p.y<0){p.y=H;p.x=Math.random()*W}cx.globalAlpha=.35+.35*Math.sin(p.t);cx.fillStyle=c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}cx.globalAlpha=1;requestAnimationFrame(f)})();
addEventListener('error',function(e){const b=document.getElementById('err');b.style.display='block';b.textContent+=(e.target&&e.target!==window&&e.target.tagName==='SCRIPT'?'ফাইল পাওয়া যায়নি: '+e.target.getAttribute('src'):(e.message||'ত্রুটি'))+'\n'},true);
})();
</script>
