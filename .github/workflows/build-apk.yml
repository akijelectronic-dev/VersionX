name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: npm install
      - name: Prepare web files and Android project
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          mkdir www
          cp -r index.html manifest.json sw.js js assets www/
          sed -i "s#<script src=\"js/app.js\"></script>#<script>window.VX_TOKEN='${APP_TOKEN}';</script><script src=\"js/app.js\"></script>#" www/index.html
          npx cap add android
          P=android/app/src/main
          cp native/*.java $P/java/com/akij/versionx/
          mkdir -p $P/res/xml
          cp native/vx_access.xml $P/res/xml/
          python3 native/patch_manifest.py
          IM=$(command -v magick || command -v convert)
          for s in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $s
            $IM assets/icon.png -resize ${2}x${2} $P/res/mipmap-$1/ic_launcher.png
            $IM assets/icon.png -resize ${2}x${2} $P/res/mipmap-$1/ic_launcher_round.png
            $IM assets/icon-fg.png -resize ${3}x${3} $P/res/mipmap-$1/ic_launcher_foreground.png
          done
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#050D24</color></resources>' > $P/res/values/ic_launcher_background.xml
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Version-X-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
